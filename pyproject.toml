[project]
name = "truthcut"
version = "0.1.0"
description = "A verifiable, audience-aware trailer planning engine"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
truthcut = "trailer_director.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
